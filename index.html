<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор клининга</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .calc-box { background-color: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 25px; font-size: 24px; }
        
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; outline: none; }
        input[type="number"]:focus, select:focus { border-color: #38bdf8; }

        .service { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #0f172a; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .service:hover { border: 1px solid #38bdf8; }
        .service span { font-size: 15px; display: flex; align-items: center; gap: 10px; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: #38bdf8; cursor: pointer; }

        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }

        button { width: 100%; padding: 16px; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; text-transform: uppercase; }
        button:hover { background-color: #0ea5e9; transform: scale(1.02); }
        
        .result-box { background: #0f172a; margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #38bdf8; }
        .result-title { font-size: 14px; color: #94a3b8; margin-bottom: 5px; }
        .result { font-size: 28px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>
    <div class="calc-box">
        <h2>Клининг под ключ</h2>
        
        <div class="row">
            <div class="input-group">
                <label>Площадь (м²)</label>
                <input type="number" id="area" value="50" min="10">
            </div>
            <div class="input-group">
                <label>Санузлы (шт)</label>
                <input type="number" id="bathrooms" value="1" min="0">
            </div>
        </div>

        <div class="input-group">
            <label>Тип уборки</label>
            <select id="cleaning-type">
                <option value="100">Поддерживающая (100 ₽/м²)</option>
                <option value="150">Генеральная (150 ₽/м²)</option>
                <option value="200">После ремонта (200 ₽/м²)</option>
            </select>
        </div>

        <label style="margin-bottom: 10px; font-size: 14px; color: #94a3b8;">Дополнительные услуги:</label>
        
        <div class="service" onclick="document.getElementById('windows').click()">
            <span>🪟 Мытье окон (+1000₽)</span>
            <input type="checkbox" id="windows">
        </div>
        
        <div class="service" onclick="document.getElementById('sofa').click()">
            <span>🛋️ Химчистка дивана (+2000₽)</span>
            <input type="checkbox" id="sofa">
        </div>
        
        <div class="service" onclick="document.getElementById('fridge').click()">
            <span>🧊 Мойка холодильника (+500₽)</span>
            <input type="checkbox" id="fridge">
        </div>

        <div class="service" onclick="document.getElementById('urgent').click()">
            <span>⏱️ Срочная уборка (+30%)</span>
            <input type="checkbox" id="urgent">
        </div>

        <button onclick="calculate()">Рассчитать стоимость</button>
        
        <div class="result-box">
            <div class="result-title">Примерная стоимость:</div>
            <div class="result" id="total">0 ₽</div>
        </div>
    </div>

    <script>
        function calculate() {
            const area = parseInt(document.getElementById('area').value) || 0;
            const bathrooms = parseInt(document.getElementById('bathrooms').value) || 0;
            const rate = parseInt(document.getElementById('cleaning-type').value);
            
            let total = area * rate;
            
            // Добавляем санузлы (например, 1500 за каждый)
            total += bathrooms * 1500;

            if (document.getElementById('windows').checked) total += 1000;
            if (document.getElementById('sofa').checked) total += 2000;
            if (document.getElementById('fridge').checked) total += 500;

            // Если срочно - накидываем 30%
            if (document.getElementById('urgent').checked) {
                total = total * 1.3;
            }

            // Округляем до целого
            total = Math.round(total);

            document.getElementById('total').innerText = total + ' ₽';
        }
    </script>
</body>
</html>
